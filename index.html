<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>29 to 06</title>

  <style>

    body {
      margin: 0;
      min-height: 100vh;

      background-image: url("oceanpixwlart.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;

      font-family: Georgia, serif;
    }


    /* =========================
       HEADER
    ========================= */

    .header-image {
      width: 80%;
      max-width: 700px;
      height: auto;
      display: block;
      margin: 20px auto 40px;
    }


    /* =========================
       CONTENEDOR DE BOTELLAS
    ========================= */

    .bottles {
      width: 90%;
      max-width: 900px;
      margin: 0 auto 50px;

      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 35px;

      justify-items: center;
      align-items: center;
    }


    /* =========================
       BOTELLAS
       BRILLO ORIGINAL
    ========================= */

    .bottle {
      width: 160px;
      height: auto;
      cursor: pointer;

      transition: transform 0.4s ease, filter 0.4s ease;

      animation: floating 3s ease-in-out infinite;
    }


    .bottle:hover {
      transform: translateY(-10px) rotate(-3deg) scale(1.05);

      filter:
        drop-shadow(0 0 12px rgba(255, 255, 255, 0.8));
    }


    /* =========================
       BOTELLA BLOQUEADA
       SOLO PARA LA PRUEBA
    ========================= */

    .bottle.locked {
      cursor: not-allowed;
    }


    /* =========================
       ANIMACIÓN DE FLOTACIÓN
    ========================= */

    @keyframes floating {

      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-8px);
      }

    }


    /* =========================
       FONDO DEL PERGAMINO
    ========================= */

    .parchment-overlay {

      position: fixed;

      inset: 0;

      width: 100%;
      height: 100%;

      background: rgba(0, 0, 0, 0.55);

      display: none;

      justify-content: center;
      align-items: center;

      z-index: 1000;

      padding: 20px;

      box-sizing: border-box;
    }


    .parchment-overlay.show {
      display: flex;
    }


    /* =========================
       PERGAMINO PNG
    ========================= */

    .parchment {

      position: relative;

      width: min(600px, 90vw);

      display: flex;

      justify-content: center;
      align-items: center;
    }


    .parchment-image {

      width: 100%;
      height: auto;

      display: block;

      user-select: none;
      pointer-events: none;
    }


    /* =========================
       TEXTO SOBRE EL PERGAMINO
    ========================= */

    .parchment-text {

      position: absolute;

      top: 50%;
      left: 50%;

      transform: translate(-50%, -50%);

      width: 65%;

      text-align: center;

      color: #4b321d;

      font-family: Georgia, serif;

      line-height: 1.5;
    }


    .parchment-title {

      margin: 0 0 18px;

      font-size: clamp(20px, 4vw, 30px);

      font-weight: bold;
    }


    .parchment-message {

      margin: 0;

      font-size: clamp(15px, 3vw, 19px);
    }


    .parchment-date {

      margin: 15px 0 0;

      font-size: clamp(15px, 3vw, 19px);

      font-weight: bold;
    }


    /* =========================
       BOTÓN CERRAR
    ========================= */

    .parchment-close {

      margin-top: 20px;

      padding: 8px 20px;

      border: 1px solid #6b4a2a;

      border-radius: 3px;

      background: rgba(255, 255, 255, 0.25);

      color: #4b321d;

      font-family: Georgia, serif;

      font-size: 14px;

      cursor: pointer;

      transition: background 0.3s ease;
    }


    .parchment-close:hover {

      background: rgba(255, 255, 255, 0.45);

    }


    /* =========================
       CELULAR
    ========================= */

    @media (max-width: 600px) {

      .header-image {

        width: 95%;

        margin-bottom: 25px;
      }


      .bottles {

        width: 95%;

        grid-template-columns: repeat(2, 1fr);

        gap: 20px;
      }


      .bottle {

        width: 120px;
      }


      .parchment {

        width: 95vw;
      }


      .parchment-text {

        width: 62%;
      }

    }

  </style>
</head>


<body>


  <!-- =========================
       HEADER
  ========================= -->

  <img
    src="titulo2.png"
    alt="una sorpresa en una botella"
    class="header-image"
  >


  <!-- =========================
       BOTELLAS
  ========================= -->

  <div class="bottles">

    <!-- 29: DISPONIBLE -->

    <img
      src="29ago.png"
      class="bottle unlocked"
      alt="Botella del 29 de agosto"
    >


    <!-- 30: BLOQUEADA SOLO PARA LA PRUEBA -->

    <img
      src="30ago.png"
      class="bottle locked"
      data-date="30 de agosto"
      alt="Botella del 30 de agosto"
    >


    <!-- RESTO: TODAVÍA SIN FUNCIONALIDAD -->

    <img
      src="31ago.png"
      class="bottle"
      alt="Botella del 31 de agosto"
    >

    <img
      src="01sep.png"
      class="bottle"
      alt="Botella del 1 de septiembre"
    >

    <img
      src="02sep.png"
      class="bottle"
      alt="Botella del 2 de septiembre"
    >

    <img
      src="03sep.png"
      class="bottle"
      alt="Botella del 3 de septiembre"
    >

    <img
      src="04sep.png"
      class="bottle"
      alt="Botella del 4 de septiembre"
    >

    <img
      src="05sep.png"
      class="bottle"
      alt="Botella del 5 de septiembre"
    >

    <img
      src="06sep.png"
      class="bottle"
      alt="Botella del 6 de septiembre"
    >

  </div>


  <!-- =========================
       PERGAMINO
  ========================= -->

  <div
    class="parchment-overlay"
    id="parchmentOverlay"
  >

    <div class="parchment">

      <img
        src="pergamino.png"
        alt="Pergamino"
        class="parchment-image"
      >


      <div class="parchment-text">

        <h2 class="parchment-title">
          Esta botella aún no puede abrirse...
        </h2>

        <p class="parchment-message">
          Su secreto todavía permanece bajo el mar.
        </p>

        <p class="parchment-date">
          Podrás abrirla el 30 de agosto.
        </p>

        <button
          class="parchment-close"
          id="parchmentClose"
        >
          Cerrar
        </button>

      </div>

    </div>

  </div>


  <!-- =========================
       JAVASCRIPT
  ========================= -->

  <script>

    const lockedBottle =
      document.querySelector(".bottle.locked");

    const parchmentOverlay =
      document.getElementById("parchmentOverlay");

    const parchmentClose =
      document.getElementById("parchmentClose");


    /* Abrir pergamino */

    lockedBottle.addEventListener("click", () => {

      parchmentOverlay.classList.add("show");

    });


    /* Cerrar con botón */

    parchmentClose.addEventListener("click", () => {

      parchmentOverlay.classList.remove("show");

    });


    /* Cerrar haciendo clic fuera */

    parchmentOverlay.addEventListener("click", (event) => {

      if (event.target === parchmentOverlay) {

        parchmentOverlay.classList.remove("show");

      }

    });


    /* Cerrar con ESC */

    document.addEventListener("keydown", (event) => {

      if (event.key === "Escape") {

        parchmentOverlay.classList.remove("show");

      }

    });

  </script>

</body>
</html>
