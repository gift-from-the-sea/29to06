<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>a gift in a bottle</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;

      background-image: url("oceanpixwlart.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;

      font-family: Georgia, serif;
    }

    /* HEADER */
    .header-image {
      width: 80%;
      max-width: 700px;
      height: auto;
      display: block;
      margin: 20px auto 40px;
    }

    /* CONTENEDOR DE LAS BOTELLAS */
    .bottles {
      width: 90%;
      max-width: 900px;
      margin: 0 auto 50px;

      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 35px;

      justify-items: center;
      align-items: center;
    }

    /* TODAS LAS BOTELLAS */
    .bottle {
      width: 160px;
      height: auto;
      cursor: pointer;

      transition:
        transform 0.4s ease,
        filter 0.4s ease;

      animation: floating 3s ease-in-out infinite;
    }

    /* BOTELLA DESBLOQUEADA */
    .bottle.unlocked {
      filter: brightness(1) saturate(1);
    }

    .bottle.unlocked:hover {
      transform: scale(1.08);

      filter:
        brightness(1.1)
        saturate(1.1)
        drop-shadow(0 0 14px rgba(255, 255, 255, 0.9));
    }

    /* BOTELLAS BLOQUEADAS */
  .bottle.locked {
  opacity: 0.45;
  filter: grayscale(0.3) brightness(0.7) saturate(0.5);
  cursor: not-allowed;

  animation: floating 4s ease-in-out infinite;
}

.bottle.locked:hover {
  opacity: 0.55;
  
}
    /* ANIMACIÓN DE FLOTACIÓN */
    @keyframes floating {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-8px);
      }
    }

    /* CELULAR */
    @media (max-width: 600px) {

      .header-image {
        width: 95%;
        margin-bottom: 25px;
      }

      .bottles {
        width: 95%;
        grid-template-columns: repeat(2, 1fr);
        gap: 20px;
      }

      .bottle {
        width: 120px;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <img
    src="titulo2.png"
    alt="Una sorpresa en una botella"
    class="header-image"
  >

  <!-- BOTELLAS -->
  <div class="bottles">

    <img
      src="29ago.png"
      class="bottle unlocked"
      alt="Botella del 29 de agosto"
    >

    <img
      src="30ago.png"
      class="bottle locked"
      alt="Botella del 30 de agosto"
    >

    <img
      src="31ago.png"
      class="bottle locked"
      alt="Botella del 31 de agosto"
    >

    <img
      src="01sep.png"
      class="bottle locked"
      alt="Botella del 1 de septiembre"
    >

    <img
      src="02sep.png"
      class="bottle locked"
      alt="Botella del 2 de septiembre"
    >

    <img
      src="03sep.png"
      class="bottle locked"
      alt="Botella del 3 de septiembre"
    >

    <img
      src="04sep.png"
      class="bottle locked"
      alt="Botella del 4 de septiembre"
    >

    <img
      src="05sep.png"
      class="bottle locked"
      alt="Botella del 5 de septiembre"
    >

    <img
      src="06sep.png"
      class="bottle locked"
      alt="Botella del 6 de septiembre"
    >

  </div>

</body>
</html>
