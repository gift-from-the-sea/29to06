<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi calendario de sorpresas</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;

      background-image: url("oceanpixwlart.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;

      font-family: Georgia, serif;
    }

    /* HEADER */
    .header-image {
      width: 80%;
      max-width: 700px;
      height: auto;
      display: block;
      margin: 20px auto 40px;
    }

    /* CONTENEDOR DE LAS BOTELLAS */
    .bottles {
      width: 90%;
      max-width: 900px;
      margin: 0 auto 50px;

      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 35px;

      justify-items: center;
      align-items: center;
    }

    /* BOTELLAS */
 .bottle {
  width: 160px;
  height: auto;
  cursor: pointer;

  transition: transform 0.3s ease;
}

.bottle:hover {
  transform: translateY(-8px) rotate(-2deg);
}
    /* CELULAR */
    @media (max-width: 600px) {
      .header-image {
        width: 95%;
        margin-bottom: 25px;
      }

      .bottles {
        width: 95%;
        grid-template-columns: repeat(2, 1fr);
        gap: 20px;
      }

      .bottle {
        width: 120px;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <img
    src="titulo2.png"
    alt="Una sorpresa en una botella"
    class="header-image"
  >

  <!-- BOTELLAS -->
  <div class="bottles">

    <img src="29ago.png" class="bottle" alt="Botella del 29 de agosto">

    <img src="30ago.png" class="bottle" alt="Botella del 30 de agosto">

    <img src="31ago.png" class="bottle" alt="Botella del 31 de agosto">

    <img src="01sep.png" class="bottle" alt="Botella del 1 de septiembre">

    <img src="02sep.png" class="bottle" alt="Botella del 2 de septiembre">

    <img src="03sep.png" class="bottle" alt="Botella del 3 de septiembre">

    <img src="04sep.png" class="bottle" alt="Botella del 4 de septiembre">

    <img src="05sep.png" class="bottle" alt="Botella del 5 de septiembre">

    <img src="06sep.png" class="bottle" alt="Botella del 6 de septiembre">

  </div>

</body>
</html>
