<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>29 to 06</title>

  <style>

    body {
      margin: 0;
      min-height: 100vh;

      background-image: url("oceanpixwlart.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;

      font-family: Georgia, serif;
    }


    /* =========================
       HEADER
    ========================= */

    .header-image {
      width: 80%;
      max-width: 700px;
      height: auto;
      display: block;
      margin: 20px auto 40px;
    }


    .music-button {
      width: 144px;
      height: auto;

      display: block;

      margin: -25px auto 35px;

      cursor: pointer;

      transition: transform 0.3s ease, filter 0.3s ease;
    }


    .music-button:hover {
      transform: scale(1.08);

      filter:
        drop-shadow(0 0 8px rgba(255, 255, 255, 0.8));
    }


    /* =========================
       CONTENEDOR DE BOTELLAS
    ========================= */

    .bottles {
      width: 90%;
      max-width: 900px;
      margin: 0 auto 50px;

      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 35px;

      justify-items: center;
      align-items: center;
    }


    /* =========================
       BOTELLAS
    ========================= */

    .bottle {
      width: 160px;
      height: auto;
      cursor: pointer;

      transition: transform 0.4s ease, filter 0.4s ease;

      animation: floating 3s ease-in-out infinite;
    }


    .bottle:hover {
      transform: translateY(-10px) rotate(-3deg) scale(1.05);

      filter:
        drop-shadow(0 0 12px rgba(255, 255, 255, 0.8));
    }


    /* =========================
       BOTELLA BLOQUEADA
    ========================= */

    .bottle.locked {
      cursor: not-allowed;
    }


    .bottle.locked:hover {
      transform: translateY(-10px) rotate(-3deg) scale(1.05);

      filter:
        drop-shadow(0 0 12px rgba(0, 0, 0, 0.9))
        drop-shadow(0 0 22px rgba(0, 0, 0, 0.7));
    }


    /* =========================
       ANIMACIÓN DE FLOTACIÓN
    ========================= */

    @keyframes floating {

      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-8px);
      }

    }


    /* =========================
       FONDO DEL PERGAMINO
    ========================= */

    .parchment-overlay {

      position: fixed;

      inset: 0;

      width: 100%;
      height: 100%;

      background: rgba(0, 0, 0, 0.55);

      display: none;

      justify-content: center;
      align-items: center;

      z-index: 1000;

      padding: 20px;

      box-sizing: border-box;
    }


    .parchment-overlay.show {
      display: flex;
    }


    /* =========================
       PERGAMINO PNG
    ========================= */

    .parchment {

      position: relative;

      width: min(600px, 90vw);

      display: flex;

      justify-content: center;
      align-items: center;
    }


    .parchment-image {

      width: 100%;
      height: auto;

      display: block;

      user-select: none;
      pointer-events: none;
    }


    /* =========================
       CONTENIDO SOBRE EL PERGAMINO
    ========================= */

    .parchment-content {

      position: absolute;

      top: 50%;
      left: 50%;

      transform: translate(-50%, -50%);

      width: 65%;

      text-align: center;

      color: #4b321d;

      font-family: Georgia, serif;

      line-height: 1.5;
    }


    /* =========================
       TEXTO DEL PERGAMINO
    ========================= */

    .parchment-title {

      margin: 0 0 18px;

      font-size: clamp(20px, 4vw, 30px);

      font-weight: bold;
    }


    .parchment-message {

      margin: 0;

      font-size: clamp(15px, 3vw, 19px);
    }


    .parchment-date {

      margin: 15px 0 0;

      font-size: clamp(15px, 3vw, 19px);

      font-weight: bold;
    }


    /* =========================
       REGALO SOBRE EL PERGAMINO
    ========================= */

    .parchment-gift {

      display: none;

      width: 70%;

      max-width: 260px;

      height: auto;

      margin: 0 auto 10px;

      user-select: none;
    }


    .parchment-gift.show {
      display: block;
    }


    /* =========================
       BOTÓN X PIRATA
    ========================= */

    .parchment-close {

      width: 42px;
      height: 42px;

      padding: 0;

      border: none;

      background: none;

      cursor: pointer;

      display: block;

      margin: 20px auto 0;

      transition: transform 0.3s ease, filter 0.3s ease;
    }


    .parchment-close:hover {

      transform: scale(1.15) rotate(5deg);

      filter:
        drop-shadow(0 0 6px rgba(0, 0, 0, 0.7))
        drop-shadow(0 0 10px rgba(255, 255, 255, 0.5));
    }


    .parchment-close img {

      width: 100%;
      height: 100%;

      object-fit: contain;

      display: block;

      user-select: none;

      pointer-events: none;
    }


    /* =========================
       CELULAR
    ========================= */

    @media (max-width: 600px) {

      .header-image {

        width: 95%;

        margin-bottom: 25px;
      }


      .bottles {

        width: 95%;

        grid-template-columns: repeat(2, 1fr);

        gap: 20px;
      }


      .bottle {

        width: 120px;
      }


      .parchment {

        width: 95vw;
      }


      .parchment-content {

        width: 62%;
      }


      .parchment-gift {

        width: 65%;

        max-width: 190px;
      }


      .parchment-close {

        width: 34px;
        height: 34px;

        margin-top: 12px;
      }

    }

  </style>
</head>


<body>


  <!-- =========================
       HEADER
  ========================= -->

  <img
    src="titulo2.png"
    alt="una sorpresa en una botella"
    class="header-image"
  >


  <img
    src="clickaqui.png"
    alt="Click aquí para escuchar"
    class="music-button"
  >


  <audio
    id="music-player"
  >
  </audio>


  <!-- =========================
       BOTELLAS
  ========================= -->

  <div class="bottles">

    <img
      src="29ago.png"
      class="bottle"
      data-date="29 de agosto"
      data-link="https://msha.ke/myhoneybee"
      alt="Botella del 29 de agosto"
    >

    <img
      src="30ago.png"
      class="bottle"
      data-date="30 de agosto"
      data-link=""
      alt="Botella del 30 de agosto"
    >

    <img
      src="31ago.png"
      class="bottle"
      data-date="31 de agosto"
      data-link=""
      alt="Botella del 31 de agosto"
    >

    <img
      src="01sep.png"
      class="bottle"
      data-date="1 de septiembre"
      data-link=""
      data-gift="Robux.png"
      alt="Botella del 1 de septiembre"
    >

    <img
      src="02sep.png"
      class="bottle"
      data-date="2 de septiembre"
      data-link=""
      alt="Botella del 2 de septiembre"
    >

    <img
      src="03sep.png"
      class="bottle"
      data-date="3 de septiembre"
      data-link=""
      alt="Botella del 3 de septiembre"
    >

    <img
      src="04sep.png"
      class="bottle"
      data-date="4 de septiembre"
      data-link=""
      alt="Botella del 4 de septiembre"
    >

    <img
      src="05sep.png"
      class="bottle"
      data-date="5 de septiembre"
      data-link=""
      alt="Botella del 5 de septiembre"
    >

    <img
      src="06sep.png"
      class="bottle"
      data-date="6 de septiembre"
      data-link=""
      data-gift="Funko.png"
      alt="Botella del 6 de septiembre"
    >

  </div>


  <!-- =========================
       PERGAMINO
  ========================= -->

  <div
    class="parchment-overlay"
    id="parchmentOverlay"
  >

    <div class="parchment">

      <img
        src="pergamino.png"
        alt="Pergamino"
        class="parchment-image"
      >


      <div class="parchment-content">

        <!-- REGALO -->
        <img
          id="parchmentGift"
          class="parchment-gift"
          src=""
          alt="Regalo"
        >


        <h2
          class="parchment-title"
          id="parchmentTitle"
        >
          Esta botella aún no puede abrirse...
        </h2>


        <p
          class="parchment-message"
          id="parchmentMessage"
        >
          Su secreto todavía permanece bajo el mar.
        </p>


        <p
          class="parchment-date"
          id="parchmentDate"
        >
          Podrás abrirla el 30 de agosto.
        </p>


        <!-- X PIRATA -->
        <button
          class="parchment-close"
          id="parchmentClose"
          aria-label="Cerrar"
        >
          <img
            src="tacha.png"
            alt="Cerrar"
          >
        </button>

      </div>

    </div>

  </div>


  <!-- =========================
       JAVASCRIPT
  ========================= -->

  <script>

  const bottles =
    document.querySelectorAll(".bottle");


  const parchmentOverlay =
    document.getElementById("parchmentOverlay");


  const parchmentClose =
    document.getElementById("parchmentClose");


  const parchmentTitle =
    document.getElementById("parchmentTitle");


  const parchmentMessage =
    document.getElementById("parchmentMessage");


  const parchmentDate =
    document.getElementById("parchmentDate");


  const parchmentGift =
    document.getElementById("parchmentGift");


  /*
    =================================
    FECHA DE INICIO DEL CALENDARIO
    =================================
  */

  const startDate =
    new Date(2026, 7, 29);


  /*
    =================================
    🧪 MODO DE PRUEBA
    =================================
  */

  const TEST_DATE = "2026-09-01";


  const today =
    new Date(TEST_DATE + "T00:00:00");


  today.setHours(0, 0, 0, 0);


  /*
    =================================
    MESES
    =================================
  */

  const months = {

    enero: 0,
    febrero: 1,
    marzo: 2,
    abril: 3,
    mayo: 4,
    junio: 5,
    julio: 6,
    agosto: 7,
    septiembre: 8,
    octubre: 9,
    noviembre: 10,
    diciembre: 11

  };


  /*
    =================================
    🎵 MÚSICA DE CADA DÍA
    =================================
  */

  const musicButton =
    document.querySelector(".music-button");


  const musicPlayer =
    document.getElementById("music-player");


  const dailyMusic = {

    "8-29": "29ago.mp3",
    "8-30": "30ago.mp3",
    "8-31": "31ago.mp3",

    "9-1": "01sep.mp3",
    "9-2": "02sep.mp3",
    "9-3": "03sep.mp3",
    "9-4": "04sep.mp3",
    "9-5": "05sep.mp3",
    "9-6": "06sep.mp3"

  };


  /*
    =================================
    IDENTIFICAR LA CANCIÓN DEL DÍA
    =================================
  */

  const musicKey =
    (today.getMonth() + 1) + "-" + today.getDate();


  const todayMusic =
    dailyMusic[musicKey];


  /*
    CARGAR LA CANCIÓN
  */

  if (todayMusic) {

    musicPlayer.src = todayMusic;

  }


  /*
    =================================
    🎵 BOTÓN DE MÚSICA
    =================================
  */

  musicButton.addEventListener("click", () => {

    if (musicPlayer.paused) {

      if (musicPlayer.currentTime >= 30) {

        musicPlayer.currentTime = 0;

      }

      musicPlayer.play();

    } else {

      musicPlayer.pause();

    }

  });


  /*
    =================================
    ⏱️ DETENER A LOS 30 SEGUNDOS
    =================================
  */

  musicPlayer.addEventListener("timeupdate", () => {

    if (musicPlayer.currentTime >= 30) {

      musicPlayer.pause();

      musicPlayer.currentTime = 0;

    }

  });


  /*
    =================================
    🍾 REVISAR CADA BOTELLA
    =================================
  */

  bottles.forEach((bottle) => {

    const dateText =
      bottle.dataset.date;


    const parts =
      dateText.split(" ");


    const day =
      parseInt(parts[0]);


    const monthName =
      parts[2];


    const month =
      months[monthName];


    const bottleDate =
      new Date(2026, month, day);


    bottleDate.setHours(0, 0, 0, 0);


    /*
      =================================
      🔒 BLOQUEADA / ✨ DESBLOQUEADA
      =================================
    */

    if (today >= bottleDate) {

      bottle.classList.add("unlocked");

      bottle.classList.remove("locked");

    } else {

      bottle.classList.add("locked");

      bottle.classList.remove("unlocked");

    }


    /*
      =================================
      🖱️ CLIC EN LA BOTELLA
      =================================
    */

    bottle.addEventListener("click", () => {

      /*
        =================================
        BOTELLA BLOQUEADA
        → PERGAMINO NORMAL
        =================================
      */

      if (bottle.classList.contains("locked")) {

        parchmentGift.classList.remove("show");

        parchmentGift.src = "";


        parchmentTitle.textContent =
          "Esta botella aún no puede abrirse...";


        parchmentMessage.textContent =
          "Su secreto todavía permanece bajo el mar.";


        parchmentDate.textContent =
          "Podrás abrirla el " + dateText + ".";


        parchmentOverlay.classList.add("show");

      }


      /*
        =================================
        BOTELLA DESBLOQUEADA
        =================================
      */

      else {

        const gift =
          bottle.dataset.gift;


        /*
          BOTELLA CON REGALO
          → PERGAMINO + APNG
        */

        if (gift) {

          parchmentGift.src = gift;

          parchmentGift.classList.add("show");


          parchmentTitle.textContent =
            "Tu sorpresa ha llegado...";


          parchmentMessage.textContent =
            "Un pequeño regalo encontrado entre las olas.";


          parchmentDate.textContent =
            "";


          parchmentOverlay.classList.add("show");

        }


        /*
          BOTELLA SIN REGALO
          → ENLACE NORMAL
        */

        else {

          const link =
            bottle.dataset.link;


          if (link) {

            window.open(link, "_blank");

          }

        }

      }

    });

  });


  /*
    =================================
    📜 CERRAR PERGAMINO
    =================================
  */

  parchmentClose.addEventListener("click", () => {

    parchmentOverlay.classList.remove("show");

  });


  /*
    CERRAR HACIENDO CLIC FUERA
  */

  parchmentOverlay.addEventListener("click", (event) => {

    if (event.target === parchmentOverlay) {

      parchmentOverlay.classList.remove("show");

    }

  });


  /*
    CERRAR CON ESC
  */

  document.addEventListener("keydown", (event) => {

    if (event.key === "Escape") {

      parchmentOverlay.classList.remove("show");

    }

  });

</script>

</body>
</html>
```
